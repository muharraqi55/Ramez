<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الدليل</title>
<style>
  :root {
    --bg: #f3f4f6;
    --card: #ffffff;
    --text: #111827;
    --muted: #6b7280;
    --accent: #2563eb;
    --vw: 100vw;
    --vh: 100vh;
  }
  :root[data-theme="dark"] {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #3b82f6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body {
    color: var(--text);
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    transition: background .25s, color .25s;
  }
  #app {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px;
    background: var(--bg);
  }
  #app.rot {
    position: fixed;
    top: 0;
    left: 0;
    width: var(--vh);
    height: var(--vw);
    min-height: 0;
    transform-origin: top left;
    transform: translateX(var(--vw)) rotate(90deg);
    overflow: auto;
    z-index: 9999;
  }

  /* زر المشاركة في الزاوية */
  .share-corner {
    position: absolute;
    top: 12px;
    left: 12px;
    width: 46px;
    height: 46px;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 21px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,.25);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
    transition: transform .15s;
  }
  .share-corner:active { transform: scale(.9); }

  .header {
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .logo-box {
    background: #ffffff;
    border-radius: 16px;
    padding: 6px 20px;
    box-shadow: 0 6px 20px rgba(0,0,0,.10);
  }
  .logo { display: block; height: 90px; width: auto; max-width: 100%; }
  .tools { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .tools button {
    padding: 9px 16px;
    font-size: 15px;
    border: none;
    border-radius: 999px;
    background: var(--card);
    color: var(--text);
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(0,0,0,.12);
  }

  .card {
    width: 100%;
    max-width: 900px;
    background: var(--card);
    border-radius: 20px;
    padding: 16px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,.12);
  }
  .photo {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 12px;
    background: #ffffff;
    margin-bottom: 16px;
  }
  .name { font-size: 26px; font-weight: 700; margin: 0 0 8px; }
  .phone {
    display: inline-block;
    font-size: 22px;
    color: var(--accent);
    text-decoration: none;
    direction: ltr;
    margin-bottom: 4px;
  }
  .note { color: var(--muted); margin: 6px 0 0; font-size: 15px; }
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 18px;
  }
  .nav button {
    flex: 1;
    padding: 12px;
    font-size: 16px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  .nav button:disabled { opacity: .35; cursor: default; }
  .counter { color: var(--muted); font-size: 14px; min-width: 60px; }

  /* رسالة صغيرة (Toast) */
  #toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #111827;
    color: #fff;
    padding: 11px 20px;
    border-radius: 999px;
    font-size: 15px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 100000;
    box-shadow: 0 6px 20px rgba(0,0,0,.3);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== ورقة الطباعة (مخفية على الشاشة) ===== */
  #printSheet { display: none; }

  @page { size: A4 portrait; margin: 10mm; }

  @media print {
    html, body { background: #fff !important; }
    #app, #toast { display: none !important; }
    #printSheet {
      display: block;
      color: #111;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .ps-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10mm;
      padding-bottom: 4mm;
      margin-bottom: 6mm;
      border-bottom: 1.2mm solid #ed2429;
    }
    .ps-head img { height: 18mm; width: auto; display: block; }
    .ps-title { text-align: left; direction: rtl; }
    .ps-title h1 { margin: 0; font-size: 20pt; }
    .ps-title p { margin: 1mm 0 0; font-size: 10pt; color: #555; }
    .ps-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6mm;
    }
    .ps-card {
      border: .4mm solid #d1d5db;
      border-top: 1.2mm solid #1fb25a;
      border-radius: 4mm;
      padding: 3mm;
      text-align: center;
      break-inside: avoid;
      page-break-inside: avoid;
      background: #fff;
    }
    .ps-card img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 2mm;
      margin-bottom: 2.5mm;
    }
    .ps-num {
      display: inline-block;
      min-width: 6mm;
      padding: .5mm 2mm;
      margin-bottom: 1.5mm;
      border-radius: 99px;
      background: #ed2429;
      color: #fff;
      font-size: 9pt;
      font-weight: 700;
    }
    .ps-name { font-size: 15pt; font-weight: 700; margin: 0 0 1mm; }
    .ps-phone { font-size: 14pt; direction: ltr; color: #1d4ed8; font-weight: 600; }
    .ps-note { font-size: 9.5pt; color: #555; margin-top: 1mm; }
    .ps-foot {
      margin-top: 6mm;
      padding-top: 2mm;
      border-top: .3mm solid #d1d5db;
      text-align: center;
      font-size: 9pt;
      color: #777;
    }
  }
</style>
</head>
<body>

<div id="app">
  <button id="shareBtn" class="share-corner" title="مشاركة الموقع" aria-label="مشاركة الموقع">📤</button>

  <div class="header">
    <div class="logo-box">
      <img class="logo" src="logo.png" alt="Ramez">
    </div>
    <div class="tools">
      <button id="homeBtn">🏠 الرئيسية</button>
      <button id="printBtn">🖨️ طباعة الكل</button>
      <button id="themeBtn">🌙 ليلي</button>
      <button id="rotateBtn">🔄 تدوير الشاشة</button>
    </div>
  </div>

  <div class="card">
    <img id="photo" class="photo" alt="">
    <h1 id="name" class="name"></h1>
    <a id="phone" class="phone" href="#"></a>
    <p id="note" class="note"></p>

    <div class="nav">
      <button id="prev">السابق</button>
      <span id="counter" class="counter"></span>
      <button id="next">التالي</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="printSheet"></div>

<script>
  // ===== الأشخاص (6 صفحات) =====
  const people = [
    { name: "ابراهيم محمد رحمة",   phone: "39611720", photo: "images/1", note: "" },
    { name: "حسينة امير علي", phone: "33487232", photo: "images/2", note: "" },
    { name: "محمد ابراهيم محمد", phone: "33880060", photo: "images/3", note: "" },
    { name: "مريم محمد عثمان", phone: "33052500", photo: "images/4", note: "" },
    { name: "مريم محمد ابراهيم", phone: "33499002", photo: "images/5", note: "" },
    { name: "عائشة محمد ابراهيم", phone: "33647883", photo: "images/6", note: "" }
  ];

  const EXTENSIONS = [".jpg", ".png", ".jpeg", ".webp"];

  const PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="285">' +
    '<rect width="1000" height="285" fill="#e2e8f0"/>' +
    '<text x="500" y="150" font-size="28" text-anchor="middle" fill="#64748b" font-family="Arial">No Image</text>' +
    '</svg>'
  );

  const photoEl = document.getElementById("photo");
  const nameEl = document.getElementById("name");
  const phoneEl = document.getElementById("phone");
  const noteEl = document.getElementById("note");
  const counterEl = document.getElementById("counter");
  const prevBtn = document.getElementById("prev");
  const nextBtn = document.getElementById("next");
  const homeBtn = document.getElementById("homeBtn");
  const printBtn = document.getElementById("printBtn");
  const shareBtn = document.getElementById("shareBtn");
  const themeBtn = document.getElementById("themeBtn");
  const rotateBtn = document.getElementById("rotateBtn");
  const appEl = document.getElementById("app");
  const toastEl = document.getElementById("toast");
  const printSheet = document.getElementById("printSheet");

  let index = 0;

  // يحمّل الصورة داخل أي عنصر img مع تجربة الامتدادات
  function loadPhotoInto(img, path, done) {
    const hasExt = /\.(jpe?g|png|webp|gif)$/i.test(path);
    const candidates = hasExt ? [path] : EXTENSIONS.map(ext => path + ext);
    let n = 0;
    img.onload = () => { if (done) done(); };
    img.onerror = () => {
      n++;
      if (n < candidates.length) {
        img.src = candidates[n];
      } else {
        img.onerror = null;
        img.onload = () => { if (done) done(); };
        img.src = PLACEHOLDER;
      }
    };
    img.src = candidates[0];
  }

  function show(i) {
    index = Math.max(0, Math.min(people.length - 1, i));
    const p = people[index];

    loadPhotoInto(photoEl, p.photo);
    photoEl.alt = p.name;
    nameEl.textContent = p.name;
    phoneEl.textContent = p.phone;
    phoneEl.href = "tel:" + p.phone;
    noteEl.textContent = p.note || "";
    noteEl.style.display = p.note ? "block" : "none";
    counterEl.textContent = (index + 1) + " / " + people.length;
    prevBtn.disabled = index === 0;
    nextBtn.disabled = index === people.length - 1;

    history.replaceState(null, "", "#" + (index + 1));
  }

  prevBtn.onclick = () => show(index - 1);
  nextBtn.onclick = () => show(index + 1);
  homeBtn.onclick = () => show(0);

  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") show(index + 1);
    if (e.key === "ArrowRight") show(index - 1);
    if (e.key === "Home") show(0);
  });

  // ===== رسالة صغيرة =====
  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
  }

  // ===== مشاركة الموقع =====
  shareBtn.onclick = async () => {
    const url = location.href.split("#")[0];
    const data = { title: document.title, text: "تفضل دليل الأرقام", url: url };
    try {
      if (navigator.share) {
        await navigator.share(data);
        return;
      }
    } catch (e) {
      if (e && e.name === "AbortError") return; // المستخدم أغلق نافذة المشاركة
    }
    try {
      await navigator.clipboard.writeText(url);
      toast("✅ تم نسخ رابط الموقع");
    } catch (e) {
      window.prompt("انسخ الرابط:", url);
    }
  };

  // ===== طباعة الجميع في صفحة واحدة =====
  function buildPrintSheet() {
    printSheet.innerHTML = "";

    const head = document.createElement("div");
    head.className = "ps-head";
    const logo = document.createElement("img");
    logo.src = "logo.png";
    logo.alt = "Ramez";
    const title = document.createElement("div");
    title.className = "ps-title";
    const dateStr = new Date().toLocaleDateString("ar-BH-u-nu-latn", {
      year: "numeric", month: "long", day: "numeric"
    });
    title.innerHTML = "<h1>دليل الأرقام</h1><p>" + dateStr + "</p>";
    head.appendChild(logo);
    head.appendChild(title);
    printSheet.appendChild(head);

    const grid = document.createElement("div");
    grid.className = "ps-grid";
    const loads = [];

    people.forEach((p, i) => {
      const card = document.createElement("div");
      card.className = "ps-card";

      const num = document.createElement("div");
      num.className = "ps-num";
      num.textContent = i + 1;

      const img = document.createElement("img");
      img.alt = p.name;
      loads.push(new Promise(res => loadPhotoInto(img, p.photo, res)));

      const nm = document.createElement("div");
      nm.className = "ps-name";
      nm.textContent = p.name;

      const ph = document.createElement("div");
      ph.className = "ps-phone";
      ph.textContent = p.phone;

      card.appendChild(num);
      card.appendChild(img);
      card.appendChild(nm);
      card.appendChild(ph);

      if (p.note) {
        const nt = document.createElement("div");
        nt.className = "ps-note";
        nt.textContent = p.note;
        card.appendChild(nt);
      }
      grid.appendChild(card);
    });
    printSheet.appendChild(grid);

    const foot = document.createElement("div");
    foot.className = "ps-foot";
    foot.textContent = "عدد الأشخاص: " + people.length;
    printSheet.appendChild(foot);

    loads.push(new Promise(res => {
      if (logo.complete) res();
      else { logo.onload = res; logo.onerror = res; }
    }));

    return Promise.all(loads);
  }

  printBtn.onclick = async () => {
    toast("⏳ جاري تجهيز الطباعة...");
    await buildPrintSheet();
    setTimeout(() => window.print(), 150);
  };

  // ===== الثيم ليلي / نهاري =====
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    themeBtn.textContent = t === "dark" ? "☀️ نهاري" : "🌙 ليلي";
    try { localStorage.setItem("theme", t); } catch (e) {}
  }
  (function initTheme() {
    let t = null;
    try { t = localStorage.getItem("theme"); } catch (e) {}
    if (!t) {
      t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    applyTheme(t);
  })();
  themeBtn.onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    applyTheme(cur === "dark" ? "light" : "dark");
  };

  // ===== تدوير الشاشة =====
  let rotated = false;
  let usedLock = false;
  let originalOrientation = "portrait";

  function sync() {
    const vv = window.visualViewport;
    const w = Math.round(vv ? vv.width : window.innerWidth);
    const h = Math.round(vv ? vv.height : window.innerHeight);
    const root = document.documentElement.style;
    root.setProperty("--vw", w + "px");
    root.setProperty("--vh", h + "px");
    const portrait = h >= w;
    appEl.classList.toggle("rot", rotated && !usedLock && portrait);
  }

  function updateRotateBtn() {
    rotateBtn.textContent = rotated ? "↩️ إرجاع الشاشة" : "🔄 تدوير الشاشة";
  }

  async function enterRotated() {
    originalOrientation = window.innerHeight >= window.innerWidth ? "portrait" : "landscape";
    const target = originalOrientation === "portrait" ? "landscape" : "portrait";
    rotated = true;
    usedLock = false;
    try {
      if (!document.fullscreenElement) {
        await document.documentElement.requestFullscreen();
      }
      await screen.orientation.lock(target);
      usedLock = true;
    } catch (e) {
      if (document.fullscreenElement) {
        try { await document.exitFullscreen(); } catch (_) {}
      }
      usedLock = false;
    }
    updateRotateBtn();
    sync();
  }

  async function exitRotated() {
    const hadLock = usedLock;
    rotated = false;
    usedLock = false;
    sync();
    updateRotateBtn();

    if (hadLock) {
      try { await screen.orientation.lock(originalOrientation); } catch (_) {}
      setTimeout(() => {
        try { screen.orientation.unlock(); } catch (_) {}
      }, 500);
    }
    if (document.fullscreenElement) {
      try { await document.exitFullscreen(); } catch (_) {}
    }
    setTimeout(sync, 600);
  }

  rotateBtn.onclick = () => {
    if (rotated) exitRotated();
    else enterRotated();
  };

  document.addEventListener("fullscreenchange", () => {
    if (!document.fullscreenElement && rotated && usedLock) {
      rotated = false;
      usedLock = false;
      try { screen.orientation.unlock(); } catch (_) {}
      updateRotateBtn();
      sync();
    }
  });

  window.addEventListener("resize", sync);
  window.addEventListener("orientationchange", () => setTimeout(sync, 200));
  if (window.visualViewport) window.visualViewport.addEventListener("resize", sync);

  sync();
  const start = parseInt(location.hash.slice(1), 10);
  show(isNaN(start) ? 0 : start - 1);
</script>
</body>
</html>
