<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الدليل</title>
<style>
  :root {
    --bg: #f3f4f6;
    --card: #ffffff;
    --text: #111827;
    --muted: #6b7280;
    --accent: #2563eb;
  }
  :root[data-theme="dark"] {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #3b82f6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body {
    color: var(--text);
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    transition: background .25s, color .25s;
  }
  #app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px;
    background: var(--bg);
  }
  /* التدوير الاحتياطي: يعمل فقط والشاشة عمودية.
     عندما تصبح الشاشة أفقية يختفي التدوير تلقائيًا */
  @media (orientation: portrait) {
    #app.rot {
      position: fixed;
      top: 0;
      left: 100vw;
      width: 100vh;
      height: 100vw;
      width: 100dvh;
      height: 100dvw;
      min-height: 0;
      transform-origin: top left;
      transform: rotate(90deg);
      overflow: auto;
      z-index: 9999;
    }
  }

  .header {
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .logo-box {
    background: #ffffff;
    border-radius: 16px;
    padding: 6px 20px;
    box-shadow: 0 6px 20px rgba(0,0,0,.10);
  }
  .logo {
    display: block;
    height: 90px;
    width: auto;
    max-width: 100%;
  }
  .tools { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .tools button {
    padding: 9px 16px;
    font-size: 15px;
    border: none;
    border-radius: 999px;
    background: var(--card);
    color: var(--text);
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(0,0,0,.12);
  }

  .card {
    width: 100%;
    max-width: 900px;
    background: var(--card);
    border-radius: 20px;
    padding: 16px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,.12);
  }
  .photo {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 12px;
    background: #ffffff;
    margin-bottom: 16px;
  }
  .name { font-size: 26px; font-weight: 700; margin: 0 0 8px; }
  .phone {
    display: inline-block;
    font-size: 22px;
    color: var(--accent);
    text-decoration: none;
    direction: ltr;
    margin-bottom: 4px;
  }
  .note { color: var(--muted); margin: 6px 0 0; font-size: 15px; }
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 18px;
  }
  .nav button {
    flex: 1;
    padding: 12px;
    font-size: 16px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  .nav button:disabled { opacity: .35; cursor: default; }
  .counter { color: var(--muted); font-size: 14px; min-width: 60px; }
</style>
</head>
<body>

<div id="app">
  <div class="header">
    <div class="logo-box">
      <img class="logo" src="logo.png" alt="Ramez">
    </div>
    <div class="tools">
      <button id="homeBtn">🏠 الرئيسية</button>
      <button id="themeBtn">🌙 ليلي</button>
      <button id="rotateBtn">🔄 تدوير الشاشة</button>
    </div>
  </div>

  <div class="card">
    <img id="photo" class="photo" alt="">
    <h1 id="name" class="name"></h1>
    <a id="phone" class="phone" href="#"></a>
    <p id="note" class="note"></p>

    <div class="nav">
      <button id="prev">السابق</button>
      <span id="counter" class="counter"></span>
      <button id="next">التالي</button>
    </div>
  </div>
</div>

<script>
  // ===== الأشخاص (6 صفحات) =====
  const people = [
    { name: "محمد",   phone: "33008860", photo: "images/1", note: "" },
    { name: "الاسم 2", phone: "00000000", photo: "images/2", note: "" },
    { name: "الاسم 3", phone: "00000000", photo: "images/3", note: "" },
    { name: "الاسم 4", phone: "00000000", photo: "images/4", note: "" },
    { name: "الاسم 5", phone: "00000000", photo: "images/5", note: "" },
    { name: "الاسم 6", phone: "00000000", photo: "images/6", note: "" }
  ];

  const EXTENSIONS = [".jpg", ".png", ".jpeg", ".webp"];

  const PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="285">' +
    '<rect width="1000" height="285" fill="#e2e8f0"/>' +
    '<text x="500" y="150" font-size="28" text-anchor="middle" fill="#64748b" font-family="Arial">No Image</text>' +
    '</svg>'
  );

  const photoEl = document.getElementById("photo");
  const nameEl = document.getElementById("name");
  const phoneEl = document.getElementById("phone");
  const noteEl = document.getElementById("note");
  const counterEl = document.getElementById("counter");
  const prevBtn = document.getElementById("prev");
  const nextBtn = document.getElementById("next");
  const homeBtn = document.getElementById("homeBtn");
  const themeBtn = document.getElementById("themeBtn");
  const rotateBtn = document.getElementById("rotateBtn");
  const appEl = document.getElementById("app");

  let index = 0;

  function loadPhoto(path) {
    const hasExt = /\.(jpe?g|png|webp|gif)$/i.test(path);
    const candidates = hasExt ? [path] : EXTENSIONS.map(ext => path + ext);
    let n = 0;
    photoEl.onerror = () => {
      n++;
      if (n < candidates.length) {
        photoEl.src = candidates[n];
      } else {
        photoEl.onerror = null;
        photoEl.src = PLACEHOLDER;
      }
    };
    photoEl.src = candidates[0];
  }

  function show(i) {
    index = Math.max(0, Math.min(people.length - 1, i));
    const p = people[index];

    loadPhoto(p.photo);
    photoEl.alt = p.name;
    nameEl.textContent = p.name;
    phoneEl.textContent = p.phone;
    phoneEl.href = "tel:" + p.phone;
    noteEl.textContent = p.note || "";
    noteEl.style.display = p.note ? "block" : "none";
    counterEl.textContent = (index + 1) + " / " + people.length;
    prevBtn.disabled = index === 0;
    nextBtn.disabled = index === people.length - 1;

    history.replaceState(null, "", "#" + (index + 1));
  }

  prevBtn.onclick = () => show(index - 1);
  nextBtn.onclick = () => show(index + 1);
  homeBtn.onclick = () => show(0);

  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") show(index + 1);
    if (e.key === "ArrowRight") show(index - 1);
    if (e.key === "Home") show(0);
  });

  // ===== الثيم ليلي / نهاري =====
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    themeBtn.textContent = t === "dark" ? "☀️ نهاري" : "🌙 ليلي";
    try { localStorage.setItem("theme", t); } catch (e) {}
  }
  (function initTheme() {
    let t = null;
    try { t = localStorage.getItem("theme"); } catch (e) {}
    if (!t) {
      t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    applyTheme(t);
  })();
  themeBtn.onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    applyTheme(cur === "dark" ? "light" : "dark");
  };

  // ===== تدوير الشاشة =====
  let rotated = false;
  let usedLock = false;

  function updateRotateBtn() {
    rotateBtn.textContent = rotated ? "↩️ إرجاع الشاشة" : "🔄 تدوير الشاشة";
  }

  async function enterRotated() {
    rotated = true;
    usedLock = false;
    const isPortrait = window.matchMedia("(orientation: portrait)").matches;
    const target = isPortrait ? "landscape" : "portrait";

    // المحاولة 1: قفل حقيقي (أندرويد/Chrome)
    try {
      if (!document.fullscreenElement) {
        await document.documentElement.requestFullscreen();
      }
      await screen.orientation.lock(target);
      usedLock = true;
    } catch (e) {
      if (document.fullscreenElement) {
        try { await document.exitFullscreen(); } catch (_) {}
      }
      // المحاولة 2: تدوير بالـ CSS (يعمل فقط والشاشة عمودية)
      appEl.classList.add("rot");
    }
    updateRotateBtn();
  }

  async function exitRotated() {
    rotated = false;
    appEl.classList.remove("rot");
    if (usedLock) {
      try { screen.orientation.unlock(); } catch (_) {}
    }
    usedLock = false;
    if (document.fullscreenElement) {
      try { await document.exitFullscreen(); } catch (_) {}
    }
    updateRotateBtn();
  }

  rotateBtn.onclick = () => {
    if (rotated) exitRotated();
    else enterRotated();
  };

  // إذا خرج المستخدم من ملء الشاشة بنفسه
  document.addEventListener("fullscreenchange", () => {
    if (!document.fullscreenElement && rotated && usedLock) {
      rotated = false;
      usedLock = false;
      try { screen.orientation.unlock(); } catch (_) {}
      updateRotateBtn();
    }
  });

  const start = parseInt(location.hash.slice(1), 10);
  show(isNaN(start) ? 0 : start - 1);
</script>
</body>
</html>
